name: macOS validation
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['Sources/**', 'Tests/**', 'scripts/**', 'assets/**', 'Package.swift', 'release-version.json', '.github/workflows/macos.yml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: python3 scripts/release-version.py --check
      - name: Validate asset restoration and signing checks
        run: |
          python3 -m unittest discover -s Tests/Assets -v
          python3 -m unittest discover -s Tests/Signing -v
      - name: Run macOS regression tests
        run: |
          mkdir -p dist/qa
          set -o pipefail
          ./scripts/test.sh -c release --jobs 3 2>&1 | tee dist/qa/macos-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-validation
          path: dist/qa/macos-tests.log
          if-no-files-found: warn
          retention-days: 30
